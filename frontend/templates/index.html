<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%E2%9A%99%3C/text%3E%3C/svg%3E">
  <title>Technical Services Intelligence Pill</title>
  <script>
    // Applied before CSS paints so a returning dark-theme user doesn't see
    // a flash of the light default. Light stays the default for everyone
    // else -- a presenter's OS dark-mode setting must not silently change
    // what's on the projector.
    if (localStorage.getItem('tbc_theme') === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  </script>
  <link rel="stylesheet" href="/static/css/app.css?v=10">
</head>
<body>
  <a class="skip-link" href="#content">Skip to main content</a>
  <div id="app">
    <!-- Nav rail -->
    <nav id="nav-rail">
      <div class="nav-brand">
        <div class="nav-logo">TBC</div>
        <div class="nav-title">Technical Services<br><span>Intelligence Pill</span></div>
      </div>
      <div class="nav-items">
        <button class="nav-item active" data-screen="dashboard" aria-label="Navigate to Dashboard">
          <span class="nav-icon" aria-hidden="true">&#9632;</span>
          <span>Dashboard</span>
        </button>
        <button class="nav-item" data-screen="diagnosis" disabled aria-label="Navigate to Diagnosis (requires a case)">
          <span class="nav-icon" aria-hidden="true">&#9679;</span>
          <span>Diagnosis</span>
        </button>
        <button class="nav-item" data-screen="decision" disabled aria-label="Navigate to AOM Decision (requires a case)">
          <span class="nav-icon" aria-hidden="true">&#10003;</span>
          <span>AOM Decision</span>
        </button>
        <button class="nav-item" data-screen="outcome" disabled aria-label="Navigate to Outcome (requires a case)">
          <span class="nav-icon" aria-hidden="true">&#10146;</span>
          <span>Outcome</span>
        </button>
        <button class="nav-item" data-screen="capture" aria-label="Navigate to Expert Knowledge Capture">
          <span class="nav-icon" aria-hidden="true">&#9998;</span>
          <span>Capture</span>
        </button>
        <button class="nav-item" data-screen="governance" aria-label="Navigate to Governance">
          <span class="nav-icon" aria-hidden="true">&#9878;</span>
          <span>Governance</span>
        </button>
      </div>
      <div class="nav-footer" id="kb-footer">
        <span id="nav-kb-version">KB loading…</span><br>
        <span class="nav-footer-sub">Keppel AI Harvest</span>
      </div>
    </nav>

    <!-- Main content -->
    <main id="main">
      <header id="topbar">
        <div style="display:flex;flex-direction:column;gap:4px">
          <h1 id="screen-title">Asset and Fault Dashboard</h1>
          <div class="breadcrumb" id="breadcrumb">
            <a href="#" onclick="event.preventDefault(); window.__app__.navigate('dashboard')">Home</a>
            <span class="breadcrumb-sep">/</span>
            <span class="breadcrumb-current" id="breadcrumb-current">Dashboard</span>
          </div>
        </div>
        <div id="role-switcher">
          <span class="badge badge-purple" id="model-chip" title="Model that drafts expert knowledge. Diagnosis itself is deterministic.">Capture model: ...</span>
          <button class="btn btn-secondary btn-sm" id="theme-toggle" aria-pressed="false" title="Switch between light and dark theme">Dark theme</button>
          <button class="btn btn-secondary btn-sm" id="guide-toggle" aria-expanded="false" aria-controls="guide-panel">Demo guide</button>
          <span class="role-badge" id="role-badge">mgr1</span>
          <label for="role-select" class="role-label">Acting as</label>
          <select id="role-select" aria-label="Select acting role">
            {% for u in users %}
            <option value="{{ u.id }}">{{ u.id }} ({{ u.role|replace('_', ' ') }})</option>
            {% endfor %}
          </select>
        </div>
      </header>
      <div id="insecure-banner" class="banner banner-warn" hidden role="alert" style="margin:12px 24px 0">
        <p><strong>Insecure demo mode (TBC_DEMO_INSECURE=1):</strong> identity can be overridden with <code>?user=</code> in the URL. Unset this on any deployment that matters.</p>
      </div>
      <div id="content" tabindex="-1"></div>
    </main>
  </div>

  <aside id="guide-panel" class="guide-panel" hidden aria-label="Demo guide"></aside>

  <!-- Toast -->
  <div id="toast" class="toast" role="alert" aria-live="assertive"></div>

  <!-- ES module entry point -->
  <script type="module">
    // Inject demo users into the module scope
    window.__DEMO_USERS__ = [
      {% for u in users %}
      { id: "{{ u.id }}", role: "{{ u.role }}" },
      {% endfor %}
    ];
  </script>
  <script type="module" src="/static/js/app.js?v=11"></script>
</body>
</html>
